<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/settled.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settled</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #ffffff;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #121212;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #initial-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: 360px;
      }
      .loader-logo {
        height: 36px;
        object-fit: contain;
      }
      .loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #27272a;
        border-top-color: #fbbf24;
        border-right-color: #f43f5e;
        border-radius: 50%;
        animation: rotateSpinner 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes rotateSpinner {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-box">
        <img src="/logo.svg" alt="Settled" class="loader-logo" />
        <div class="loader-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
